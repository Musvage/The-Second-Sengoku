 ### IDEOLOGIES
 ### --- Democratic / Conservative
 democratic:0 "Conservative"
 democratic_noun:0 "Conservatism"
 democratic_desc:0 "Conservative Regime"
 dem_liberalism:0 "Liberalism"
 dem_liberalism_desc:0 "With a long philosophical tradition of valuing personal liberty, liberalism views safeguarding these rights as the primary function of the state."
 ### --- Neutrality / Authoritarianism
 neutrality:0 "Authoritarianism"
 neutrality_noun:0 "Authoritarianism"
 junta:0 "Military Junta"
 junta_desc:0 "A military junta is a dictatorship wherein the government is headed by a group of high-ranking military officers with substantial or complete political power."
 oligarchism:0 "Oligarchic"
 oligarchism_desc:0 "Oligarchy is a form of government in which a restricted clique rules without legal or effective checks and balances."
 PRO_oligarchism_name:0 "Corporatism"
 PRO_oligarchism_desc:0 "Corporatism is a system in which the State is indirectly (or even directly) controlled by large economic conglomerates or chartered companies."
 HIR_oligarchism_name:0 "Corporatism"
 HIR_oligarchism_desc:0 "Corporatism is a system in which the State is indirectly (or even directly) controlled by large economic conglomerates or chartered companies."
 despotism:0 "Despotic"
 despotism_desc:0 "Despotism is a form of government in which a single person or a restricted clique rules without legal or effective checks and balances."
 AMO_despotism_name:0 "Military Order"
 AMO_despotism_desc:0 "A military order is an anachronistic form of government in which the few civil administrative institutions are auxiliaries to the military force that controls the State, with the society under it bound by adherence to cultural and religious traditions."
 moderatism:1 "Moderatism"
 moderatism_desc:1 "Moderatism is a form of government which avoids the extremes of left and right by taking a moderate position or course of action."
 centrism:1 "Centrism"
 centrism_desc:1 "Centrism is a form of government which wants to achieve common sense solutions that appropriately address current and future needs, that support the public trust and serve the common good with consideration of risk and capacity in the context of these needs."
 ### --- Communism
 communism:0 "Communism"
 communism_noun:0 "Communism"
 communism_desc:0 "Communist Regime"
 juche:0 "Juche"
 juche_desc:0 "Juche aims to move the nation towards jaju ('independence') through the construction of a jarip ('national economy') with an emphasis on jawi ('self-defence') to establish socialism."
 nazism:0 "Nazism"
 communism_buddhism:0 "Dharmic Socialism"
 communism_buddhism_desc:0 "Dharmic Socialism is a form of socialism based on the principles of Buddhism, since both seek to provide an end to suffering by analyzing its conditions and removing its main causes through praxis."
 ### --- Fascism
 fascism:0 "Fascist"
 fascism_noun:0 "Fascist"
 fascism_desc:0 "Totalitarian Regime"
 nazism:0 "Nazism"  # censored version
 nazism_desc:0 "Rooted in extreme nationalism, National Socialism is driven by ideas of Germanic supremacy. It promotes aggressive expansionism and a totalitarian state where the people are united under a leader with absolute power, the Führer."
 nazism_2:0 "Nazism"    # uncensored version
 nazism_2_desc:0 "Rooted in extreme nationalism, National Socialism is driven by ideas of Germanic supremacy. It promotes aggressive expansionism and a totalitarian state where the people are united under a leader with absolute power, the Führer."
 mafia_state:0 "Kakistocracy"
 mafia_state_desc:0 "A kakistocracy is a system of government that is run by the worst and most unscrupulous citizens. Violence, fear and corruption keep both the population and the administration in line."
 fascism_shinto:0 "State Shinto"
 fascism_shinto_desc:0 "State Shintoism is a political and spiritual ideology that imposes strict laws based on traditional Japanese folk religion. Shintoism was the official religion of the Japanese Empire, which emphasized the divinity of the emperor."
 ### --- Autocratic / Monarchy
 autocracy:0 "Monarchy"
 autocracy_noun:0 "Monarchism"
 autocracy_desc:0 "Monarchic Regime"
 autocracy_subtype:0 "Monarchy"
 autocracy_subtype_desc:0 "Monarchy is a system of government in which the head of State is determined by hereditary succession and has great influence over the administration, even if the government is, nominally, headed by another person."
 autocracy_mandate_of_haven:0 "Mandate of Heaven"
 autocracy_mandate_of_haven:0 "The Mandate of Heaven is a traditional Chinese political philosophy according to which Heaven  – which embodies the natural order and will of the universe – bestows the mandate on a just ruler of China."
 autocracy_supernatural:0 "Supernatural Monarchy"
 autocracy_supernatural_desc:0 "A supernatural monarchy is a system of government in which the head of State's legitimacy is given by his or her ability - real or perceived - to mobilize spiritual forces."
 SHO_autocracy_subtype_name:0 "Bakufu"
 SHO_autocracy_subtype_desc:0 "The 'bakuhan' system split feudal power between the Shogun and the daimyos, feudal lords with their bureaucracies, policies, and territories. The daimyos' dominions had a degree of sovereignty and were allowed an independent administration in exchange for loyalty to the shōgun, who was responsible for foreign relations, national security and coinage."
 ### --- Social Democracy
 democratic_socialism:0 "Social Democratic"
 democratic_socialism_noun:0 "Social Democracy"
 democratic_socialism_desc:0 "Social Democratic Regime"
 dssubtype:0 "Social Democratic"
 dssubtype_desc:0 "Striving for equality and a socialist state by reformist means, democratic socialism aims to abolish or mitigate the effects of capitalism with a public mandate."
